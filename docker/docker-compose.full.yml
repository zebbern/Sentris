services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: sentris-postgres
    environment:
      POSTGRES_USER: sentris
      POSTGRES_PASSWORD: sentris
      POSTGRES_DB: sentris
      POSTGRES_MULTIPLE_DATABASES: temporal
    # Internal only - no direct port access in production
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentris']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: sentris-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - DB_NAME=temporal
      - POSTGRES_USER=sentris
      - POSTGRES_PWD=sentris
      - POSTGRES_SEEDS=postgres
      - AUTO_SETUP=true
      - DEFAULT_NAMESPACE=sentris-prod
    expose:
      - '7233'
    volumes:
      - temporal_data:/var/lib/temporal
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'tctl --address $(hostname -i):7233 --namespace sentris-prod namespace describe',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: sentris-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=sentris-prod
    expose:
      - '8080'
    depends_on:
      - temporal
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080']
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: sentris-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    expose:
      - '9000'
      - '9001'
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 5

  loki:
    image: grafana/loki:3.2.1
    container_name: sentris-loki
    command: -config.file=/etc/loki/local-config.yaml
    expose:
      - '3100'
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: sentris-redis
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.5
    container_name: sentris-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --advertise-kafka-addr=redpanda:9092
      - --set
      - redpanda.log_retention_ms=604800000
    expose:
      - '9092'
      - '9644'
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9644/v1/status/ready']
      interval: 30s
      timeout: 10s
      retries: 5

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: sentris-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /etc/redpanda/console-config.yaml
    expose:
      - '8080'
    volumes:
      - ./redpanda-console-config.yaml:/etc/redpanda/console-config.yaml:ro
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: sentris-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m'
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - '9200'
      - '9600'
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    build:
      context: .
      dockerfile: opensearch-dashboards.Dockerfile
    image: sentris-opensearch-dashboards:2.11.1
    container_name: sentris-opensearch-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    expose:
      - '5601'
    volumes:
      - ./opensearch-dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:5601/analytics/api/status || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch-init:
    image: curlimages/curl:8.5.0
    container_name: sentris-opensearch-init
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
    volumes:
      - ./opensearch-init.sh:/init.sh:ro
    entrypoint: ['/bin/sh', '/init.sh']
    restart: 'no'

  # Applications
  dind:
    image: docker:27-dind
    container_name: sentris-dind
    privileged: true
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /sentris-docker-io/runs /sentris-docker-io/metadata
        chmod 0777 /sentris-docker-io/runs /sentris-docker-io/metadata
        exec /usr/local/bin/dockerd-entrypoint.sh "$$@"
      - --
    command: ['--storage-driver=overlay2']
    environment:
      - DOCKER_TLS_CERTDIR=/certs
      - DOCKER_TLS_SAN=DNS:dind
    volumes:
      - docker_data:/var/lib/docker
      - dind_ca:/certs/ca
      - dind_client_certs:/certs/client
      - dind_io:/sentris-docker-io
    networks:
      - docker-control
    healthcheck:
      test: ['CMD', 'docker', 'info']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/zebbern/sentris-backend:${SENTRIS_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: backend
    container_name: sentris-backend
    environment:
      - NODE_ENV=production
      - SENTRIS_ENV=production
      - SENTRIS_TRUST_PROFILE=${SENTRIS_TRUST_PROFILE:-trusted-local}
      - SENTRIS_INSTANCE=${SENTRIS_INSTANCE:-0}
      - FINDINGS_RECONCILIATION_SCHEDULE_ENABLED=${FINDINGS_RECONCILIATION_SCHEDULE_ENABLED:-true}
      - PORT=3211
      - DATABASE_URL=postgresql://sentris:sentris@postgres:5432/sentris
      - ENABLE_INGEST_SERVICES=true
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=sentris-prod
      - TEMPORAL_TASK_QUEUE=sentris-prod
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - LOKI_URL=http://loki:3100
      - LOKI_PUSH_TIMEOUT_MS=${LOKI_PUSH_TIMEOUT_MS:-10000}
      - REDIS_URL=redis://redis:6379
      - TERMINAL_REDIS_URL=redis://redis:6379
      - LOG_KAFKA_BROKERS=redpanda:9092
      - LOG_KAFKA_TOPIC=telemetry.logs
      - LOG_KAFKA_CLIENT_ID=sentris-backend-${SENTRIS_INSTANCE:-0}
      - LOG_KAFKA_GROUP_ID=sentris-backend-log-consumer-${SENTRIS_INSTANCE:-0}
      - TELEMETRY_KAFKA_REPLAY_RETENTION_DAYS=7
      - EVENT_KAFKA_TOPIC=telemetry.events
      - EVENT_KAFKA_CLIENT_ID=sentris-backend-events-${SENTRIS_INSTANCE:-0}
      - EVENT_KAFKA_GROUP_ID=sentris-event-ingestor-${SENTRIS_INSTANCE:-0}
      - AGENT_TRACE_KAFKA_TOPIC=telemetry.agent-trace
      - AGENT_TRACE_KAFKA_CLIENT_ID=sentris-backend-agent-trace-${SENTRIS_INSTANCE:-0}
      - AGENT_TRACE_KAFKA_GROUP_ID=sentris-agent-trace-ingestor-${SENTRIS_INSTANCE:-0}
      - NODE_IO_KAFKA_TOPIC=telemetry.node-io
      - NODE_IO_KAFKA_CLIENT_ID=sentris-backend-node-io-${SENTRIS_INSTANCE:-0}
      - NODE_IO_KAFKA_GROUP_ID=sentris-node-io-ingestor-${SENTRIS_INSTANCE:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-local}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - JIRA_CLIENT_ID=${JIRA_CLIENT_ID:-}
      - JIRA_CLIENT_SECRET=${JIRA_CLIENT_SECRET:-}
      - JIRA_CALLBACK_URL=${JIRA_CALLBACK_URL:-}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      # Optional, operator-owned server analytics. Empty values keep it disabled.
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-}
      - DISABLE_ANALYTICS=${DISABLE_ANALYTICS:-false}
      # Internal service token for worker->backend auth
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      # OpenSearch tenant provisioning
      - OPENSEARCH_SECURITY_ENABLED=${OPENSEARCH_SECURITY_ENABLED:-false}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_TENANT_FETCH_TIMEOUT_MS=${OPENSEARCH_TENANT_FETCH_TIMEOUT_MS:-5000}
      - OPENSEARCH_DASHBOARDS_URL=http://opensearch-dashboards:5601/analytics
      - OPENSEARCH_ADMIN_USERNAME=${OPENSEARCH_ADMIN_USERNAME:-admin}
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-}
      - SECRET_STORE_MASTER_KEY=${SECRET_STORE_MASTER_KEY:?SECRET_STORE_MASTER_KEY is required}
      - INTEGRATION_STORE_MASTER_KEY=${INTEGRATION_STORE_MASTER_KEY:-${SECRET_STORE_MASTER_KEY:?SECRET_STORE_MASTER_KEY is required}}
    # Internal only - accessed via nginx at /api/
    expose:
      - '3211'
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/zebbern/sentris-frontend:${SENTRIS_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: frontend
    container_name: sentris-frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_APP_NAME=${VITE_APP_NAME:-}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-}
      - VITE_FRONTEND_BRANCH=${VITE_FRONTEND_BRANCH:-}
      - VITE_BACKEND_BRANCH=${VITE_BACKEND_BRANCH:-}
      - VITE_ENABLE_CONNECTIONS=${VITE_ENABLE_CONNECTIONS:-true}
      - VITE_ENABLE_IT_OPS=${VITE_ENABLE_IT_OPS:-false}
      - VITE_DEVTOOLS=${VITE_DEVTOOLS:-false}
      - VITE_DISABLE_ANALYTICS=${VITE_DISABLE_ANALYTICS:-false}
      - VITE_LOGO_DEV_PUBLIC_KEY=${VITE_LOGO_DEV_PUBLIC_KEY:-}
      - VITE_PUBLIC_POSTHOG_KEY=${VITE_PUBLIC_POSTHOG_KEY:-}
      - VITE_PUBLIC_POSTHOG_HOST=${VITE_PUBLIC_POSTHOG_HOST:-}
      - VITE_OPENSEARCH_DASHBOARDS_URL=${VITE_OPENSEARCH_DASHBOARDS_URL:-/analytics}
      - VITE_AUTH_PROVIDER=${VITE_AUTH_PROVIDER:-local}
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-}
      - VITE_CLERK_JWT_TEMPLATE=${VITE_CLERK_JWT_TEMPLATE:-}
      - VITE_API_AUTH_PROVIDER=${VITE_API_AUTH_PROVIDER:-}
      - VITE_DEFAULT_ORG_ID=${VITE_DEFAULT_ORG_ID:-local-dev}
      - VITE_DEFAULT_ORG=${VITE_DEFAULT_ORG:-}
      - VITE_DEFAULT_USER_ID=${VITE_DEFAULT_USER_ID:-}
      - VITE_GITHUB_TEMPLATE_REPO=${VITE_GITHUB_TEMPLATE_REPO:-}
      - VITE_GITHUB_TEMPLATE_BRANCH=${VITE_GITHUB_TEMPLATE_BRANCH:-}
    # Internal only - accessed via nginx at /
    expose:
      - '8080'
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080']
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    image: ghcr.io/zebbern/sentris-worker:${SENTRIS_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    container_name: sentris-worker
    environment:
      - NODE_ENV=production
      - SENTRIS_ENV=production
      - SENTRIS_TRUST_PROFILE=${SENTRIS_TRUST_PROFILE:-trusted-local}
      - SENTRIS_DEPLOYMENT_ID=${SENTRIS_DEPLOYMENT_ID:-sentris}
      - SENTRIS_INSTANCE=${SENTRIS_INSTANCE:-0}
      - MCP_DISCOVERY_TRUSTED_LOCAL_STDIO=${MCP_DISCOVERY_TRUSTED_LOCAL_STDIO:-false}
      - SENTRIS_PUBLIC_API_BASE_URL=${SENTRIS_PUBLIC_API_BASE_URL:?SENTRIS_PUBLIC_API_BASE_URL is required}
      - DATABASE_URL=postgresql://sentris:sentris@postgres:5432/sentris
      - WORKER_DATABASE_CONNECTION_TIMEOUT_MS=${WORKER_DATABASE_CONNECTION_TIMEOUT_MS:-10000}
      - WORKER_DATABASE_QUERY_TIMEOUT_MS=${WORKER_DATABASE_QUERY_TIMEOUT_MS:-30000}
      - ENABLE_INGEST_SERVICES=true
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=sentris-prod
      - TEMPORAL_TASK_QUEUE=sentris-prod
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_BUCKET_NAME=sentris-files
      - LOKI_URL=http://loki:3100
      - TERMINAL_REDIS_URL=redis://redis:6379
      - TERMINAL_REDIS_COMMAND_TIMEOUT_MS=${TERMINAL_REDIS_COMMAND_TIMEOUT_MS:-10000}
      - MCP_RUNTIME_REDIS_URL=redis://redis:6379
      - MCP_RUNTIME_OWNER_ID=sentris-worker-${SENTRIS_INSTANCE:-0}
      - MCP_RUNTIME_OWNER_URL=http://sentris-worker:9301
      - MCP_RUNTIME_LISTEN_HOST=0.0.0.0
      - MCP_RUNTIME_LISTEN_PORT=9301
      - DOCKER_HOST=tcp://dind:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
      - SENTRIS_DIND_HOST=dind
      - SENTRIS_DOCKER_SHARED_IO_ROOT=/sentris-docker-io
      - MCP_DOCKER_PROXY_PORT=9101
      - MCP_DOCKER_PROXY_PUBLIC_BASE_URL=http://worker:9101
      - MCP_DOCKER_PROXY_TOKEN=${MCP_DOCKER_PROXY_TOKEN:-}
      - WORKER_ORPHAN_MIN_AGE_MS=${WORKER_ORPHAN_MIN_AGE_MS:-3600000}
      - WORKER_ORPHAN_INTERVAL_MS=${WORKER_ORPHAN_INTERVAL_MS:-900000}
      - WORKER_ORPHAN_MAX_RESOURCES=${WORKER_ORPHAN_MAX_RESOURCES:-100}
      - WORKER_ORPHAN_MAX_INVENTORY=${WORKER_ORPHAN_MAX_INVENTORY:-500}
      - WORKER_ORPHAN_DOCKER_TIMEOUT_MS=${WORKER_ORPHAN_DOCKER_TIMEOUT_MS:-10000}
      - WORKER_ORPHAN_RUN_STATE_TIMEOUT_MS=${WORKER_ORPHAN_RUN_STATE_TIMEOUT_MS:-3000}
      - WORKER_HEALTH_PORT=9100
      - LOG_KAFKA_BROKERS=redpanda:9092
      - LOG_KAFKA_TOPIC=telemetry.logs
      - LOG_KAFKA_CLIENT_ID=sentris-worker-${SENTRIS_INSTANCE:-0}
      - EVENT_KAFKA_TOPIC=telemetry.events
      - EVENT_KAFKA_CLIENT_ID=sentris-worker-events-${SENTRIS_INSTANCE:-0}
      - AGENT_TRACE_KAFKA_TOPIC=telemetry.agent-trace
      - AGENT_TRACE_KAFKA_CLIENT_ID=sentris-worker-agent-trace-${SENTRIS_INSTANCE:-0}
      - NODE_IO_KAFKA_TOPIC=telemetry.node-io
      - NODE_IO_KAFKA_CLIENT_ID=sentris-worker-node-io-${SENTRIS_INSTANCE:-0}
      # OpenSearch for Analytics Sink
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_DASHBOARDS_URL=http://opensearch-dashboards:5601/analytics
      # Tenant provisioning (for multi-tenant security mode)
      - BACKEND_URL=http://backend:3211
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - SECRET_STORE_MASTER_KEY=${SECRET_STORE_MASTER_KEY:?SECRET_STORE_MASTER_KEY is required}
      - OPENSEARCH_SECURITY_ENABLED=${OPENSEARCH_SECURITY_ENABLED:-false}
    expose:
      - '9100'
      - '9101'
      - '9301'
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      dind:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - dind_client_certs:/certs/client:ro
      - dind_io:/sentris-docker-io
    networks:
      - default
      - docker-control
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9100/health/ready']
      interval: 30s
      timeout: 10s
      retries: 5

  # Nginx reverse proxy - unified entry point
  nginx:
    image: nginx:1.25-alpine
    container_name: sentris-nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
      opensearch-dashboards:
        condition: service_healthy
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  loki_data:
  temporal_data:
  docker_data:
  dind_ca:
  dind_client_certs:
  dind_io:
  redis_data:
  redpanda_data:
  opensearch_data:

networks:
  default:
    name: sentris-network
  docker-control:
    name: sentris-docker-control
    driver: bridge
    internal: false
